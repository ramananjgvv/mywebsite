<!DOCTYPE html>
<html>
<head>
    <!-- The title shows up at the very top tab of your web browser -->
    <title>My Awesome Web Page</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
            background:
                radial-gradient(ellipse at 20% 20%, #f9a8d4 0, transparent 40%),
                radial-gradient(ellipse at 80% 80%, #67e8f9 0, transparent 45%),
                linear-gradient(135deg, #312e81, #7c3aed 55%, #2563eb);
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;
            padding: 16px 32px;
            background: rgb(22 18 55 / 35%);
            border-bottom: 1px solid rgb(255 255 255 / 20%);
            backdrop-filter: blur(12px);
        }

        .toolbar a {
            color: inherit;
            text-decoration: none;
        }

        .toolbar-brand {
            justify-self: start;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .page-search {
            display: flex;
            gap: 8px;
            width: min(100%, 520px);
            margin: 24px auto;
        }

        .toolbar-settings {
            justify-self: end;
        }

        .page-search input {
            flex: 1;
            min-width: 0;
            padding: 8px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .page-search button {
            padding: 8px 12px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
            cursor: pointer;
        }

        .toolbar-links {
            display: flex;
            gap: 24px;
        }

        .toolbar-settings {
            position: relative;
        }

        .toolbar-settings summary {
            cursor: pointer;
            list-style: none;
        }

        .toolbar-settings summary::-webkit-details-marker {
            display: none;
        }

        .settings-menu {
            position: absolute;
            z-index: 1;
            top: calc(100% + 12px);
            right: 0;
            min-width: 190px;
            padding: 16px;
            border: 1px solid rgb(255 255 255 / 25%);
            border-radius: 12px;
            background: #211c4b;
            box-shadow: 0 12px 30px rgb(0 0 0 / 25%);
            text-align: left;
        }

        .settings-menu label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .settings-menu select,
        .settings-menu input {
            width: 100%;
            padding: 8px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .toolbar-links a:hover,
        .toolbar-links a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        .toolbar-settings summary:hover,
        .toolbar-settings summary:focus-visible {
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        body[data-wallpaper="sunset"] {
            background:
                radial-gradient(ellipse at 75% 15%, #fde68a 0, transparent 35%),
                linear-gradient(145deg, #7f1d4e, #ea580c 55%, #fbbf24);
        }

        body[data-wallpaper="ocean"] {
            background:
                radial-gradient(ellipse at 20% 20%, #67e8f9 0, transparent 40%),
                radial-gradient(ellipse at 85% 75%, #60a5fa 0, transparent 45%),
                linear-gradient(135deg, #082f49, #0369a1 55%, #164e63);
        }

        body[data-wallpaper="forest"] {
            background:
                radial-gradient(ellipse at 75% 20%, #bef264 0, transparent 38%),
                radial-gradient(ellipse at 15% 85%, #34d399 0, transparent 45%),
                linear-gradient(135deg, #14532d, #166534 55%, #064e3b);
        }

        main {
            flex: 1;
            display: grid;
            place-content: center;
            padding: 24px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .painting-section {
            margin: 40px auto 0;
        }

        .painting-tools {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .painting-tools label {
            font-weight: 600;
        }

        .painting-tools input,
        .painting-tools button {
            min-height: 40px;
            padding: 6px 10px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .painting-tools input {
            width: 48px;
            padding: 4px;
        }

        .painting-tools button {
            cursor: pointer;
        }

        #painting-canvas {
            display: block;
            width: min(100%, 640px);
            height: auto;
            aspect-ratio: 2;
            border: 1px solid rgb(255 255 255 / 70%);
            border-radius: 8px;
            background: #fff;
            cursor: crosshair;
            touch-action: none;
        }

        .game-section {
            margin: 40px auto 0;
        }

        .game-status {
            min-height: 1.6em;
            margin: 0 0 16px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, minmax(72px, 96px));
            gap: 8px;
            justify-content: center;
        }

        .game-cell {
            aspect-ratio: 1;
            border: 1px solid rgb(255 255 255 / 70%);
            border-radius: 10px;
            color: #211c4b;
            background: rgb(255 255 255 / 90%);
            font: inherit;
            font-size: 2.5rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-cell:disabled {
            cursor: default;
        }

        .game-cell:focus-visible,
        #reset-game:focus-visible {
            outline: 3px solid #fde68a;
            outline-offset: 3px;
        }

        #reset-game {
            margin-top: 16px;
            padding: 8px 12px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
            cursor: pointer;
        }

        .notes-section {
            width: min(100%, 640px);
            margin: 40px auto 0;
        }

        .notes-form {
            display: grid;
            gap: 12px;
            text-align: left;
        }

        .notes-form label {
            font-weight: 600;
        }

        .notes-form input,
        .notes-form textarea,
        .notes-form button,
        .note-actions button {
            padding: 8px 10px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .notes-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .notes-form button,
        .note-actions button {
            cursor: pointer;
        }

        .notes-form-actions,
        .note-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .notes-status {
            min-height: 1.6em;
            margin: 12px 0;
        }

        .notes-list {
            display: grid;
            gap: 12px;
            text-align: left;
        }

        .note-card {
            padding: 16px;
            border: 1px solid rgb(255 255 255 / 35%);
            border-radius: 10px;
            background: rgb(22 18 55 / 35%);
            overflow-wrap: anywhere;
        }

        .note-card h3 {
            margin: 0 0 8px;
        }

        .note-card p {
            margin: 0 0 12px;
            white-space: pre-wrap;
        }

        @media (max-width: 800px) {
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                padding: 14px 18px;
            }

            .toolbar-links {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <a class="toolbar-brand" href="#home">My world</a>
        <details class="toolbar-settings">
            <summary>Settings</summary>
            <div class="settings-menu">
                <label for="page-title-setting">Page title</label>
                <input id="page-title-setting" type="text" value="My Awesome Web Page">
                <label for="wallpaper">Wallpaper</label>
                <select id="wallpaper">
                    <option value="aurora">Aurora</option>
                    <option value="sunset">Sunset</option>
                    <option value="ocean">Ocean</option>
                    <option value="forest">Forest</option>
                </select>
            </div>
        </details>
    </header>
    <main id="home">
        <section aria-labelledby="page-title">
            <h1 id="page-title">Hello, World! 🚀</h1>
            <form class="page-search" action="https://www.google.com/search" method="get" role="search">
                <input type="search" name="q" aria-label="Search Google" placeholder="Search the web" required>
                <button type="submit">Search</button>
            </form>
            <p id="about">Welcome to my very first website built by me, my name is raj!</p>
            <p>today is a holiday</p>
            <section class="painting-section" aria-labelledby="painting-title">
                <h2 id="painting-title">Painting</h2>
                <div class="painting-tools">
                    <label for="paint-color">Brush color</label>
                    <input id="paint-color" type="color" value="#211c4b">
                    <button id="clear-painting" type="button">Clear</button>
                </div>
                <canvas id="painting-canvas" width="800" height="400" aria-label="Painting canvas. Draw by dragging with a mouse, touch, or pen.">
                    Your browser does not support the painting canvas.
                </canvas>
            </section>
            <section class="game-section" aria-labelledby="game-title">
                <h2 id="game-title">Tic Tac Toe</h2>
                <p id="game-status" class="game-status" aria-live="polite">X's turn</p>
                <div class="game-board" role="group" aria-label="Tic Tac Toe board">
                    <button class="game-cell" type="button" data-cell="0" aria-label="Row 1, column 1, empty"></button>
                    <button class="game-cell" type="button" data-cell="1" aria-label="Row 1, column 2, empty"></button>
                    <button class="game-cell" type="button" data-cell="2" aria-label="Row 1, column 3, empty"></button>
                    <button class="game-cell" type="button" data-cell="3" aria-label="Row 2, column 1, empty"></button>
                    <button class="game-cell" type="button" data-cell="4" aria-label="Row 2, column 2, empty"></button>
                    <button class="game-cell" type="button" data-cell="5" aria-label="Row 2, column 3, empty"></button>
                    <button class="game-cell" type="button" data-cell="6" aria-label="Row 3, column 1, empty"></button>
                    <button class="game-cell" type="button" data-cell="7" aria-label="Row 3, column 2, empty"></button>
                    <button class="game-cell" type="button" data-cell="8" aria-label="Row 3, column 3, empty"></button>
                </div>
                <button id="reset-game" type="button">New game</button>
            </section>
            <section class="notes-section" aria-labelledby="notes-title">
                <h2 id="notes-title">Notes</h2>
                <form id="notes-form" class="notes-form">
                    <label for="note-title">Title</label>
                    <input id="note-title" name="title" type="text" maxlength="120" required>
                    <label for="note-content">Note</label>
                    <textarea id="note-content" name="content" required></textarea>
                    <div class="notes-form-actions">
                        <button id="save-note" type="submit">Add note</button>
                        <button id="cancel-note-edit" type="button" hidden>Cancel edit</button>
                    </div>
                </form>
                <p id="notes-status" class="notes-status" aria-live="polite"></p>
                <div id="notes-list" class="notes-list" aria-label="Saved notes"></div>
            </section>
        </section>
    </main>
    <script>
        const pageTitleInput = document.querySelector("#page-title-setting");
        const pageHeading = document.querySelector("#page-title");
        const wallpaperSelector = document.querySelector("#wallpaper");
        const paintingCanvas = document.querySelector("#painting-canvas");
        const paintingContext = paintingCanvas.getContext("2d");
        const paintColor = document.querySelector("#paint-color");
        const clearPaintingButton = document.querySelector("#clear-painting");
        const gameCells = [...document.querySelectorAll(".game-cell")];
        const gameStatus = document.querySelector("#game-status");
        const resetGameButton = document.querySelector("#reset-game");
        const notesForm = document.querySelector("#notes-form");
        const noteTitleInput = document.querySelector("#note-title");
        const noteContentInput = document.querySelector("#note-content");
        const saveNoteButton = document.querySelector("#save-note");
        const cancelNoteEditButton = document.querySelector("#cancel-note-edit");
        const notesStatus = document.querySelector("#notes-status");
        const notesList = document.querySelector("#notes-list");
        const notesStorageKey = "my-world-notes";
        const winningLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];
        let gameBoard = Array(9).fill("");
        let currentPlayer = "X";
        let gameOver = false;
        let notes = [];
        let editingNoteId = null;
        let isPainting = false;

        const resetNoteForm = () => {
            notesForm.reset();
            editingNoteId = null;
            saveNoteButton.textContent = "Add note";
            cancelNoteEditButton.hidden = true;
        };

        const saveNotes = () => {
            try {
                localStorage.setItem(notesStorageKey, JSON.stringify(notes));
                return true;
            } catch {
                notesStatus.textContent = "Couldn't save notes in this browser. Check that storage is available and try again.";
                return false;
            }
        };

        const renderNotes = () => {
            notesList.replaceChildren();
            if (notes.length === 0) {
                const emptyMessage = document.createElement("p");
                emptyMessage.textContent = "No notes yet. Add one above.";
                notesList.append(emptyMessage);
                return;
            }

            notes.forEach((note) => {
                const card = document.createElement("article");
                card.className = "note-card";
                const title = document.createElement("h3");
                title.textContent = note.title;
                const content = document.createElement("p");
                content.textContent = note.content;
                const actions = document.createElement("div");
                actions.className = "note-actions";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => {
                    editingNoteId = note.id;
                    noteTitleInput.value = note.title;
                    noteContentInput.value = note.content;
                    saveNoteButton.textContent = "Save changes";
                    cancelNoteEditButton.hidden = false;
                    notesStatus.textContent = "Editing note.";
                    noteTitleInput.focus();
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => {
                    notes = notes.filter((savedNote) => savedNote.id !== note.id);
                    renderNotes();
                    if (saveNotes()) {
                        notesStatus.textContent = "Note deleted.";
                    }
                });

                actions.append(editButton, deleteButton);
                card.append(title, content, actions);
                notesList.append(card);
            });
        };

        const loadNotes = () => {
            let savedNotes;
            try {
                savedNotes = localStorage.getItem(notesStorageKey);
            } catch {
                notesStatus.textContent = "Couldn't access saved notes in this browser.";
                return;
            }

            if (!savedNotes) {
                renderNotes();
                return;
            }

            let parsedNotes;
            try {
                parsedNotes = JSON.parse(savedNotes);
            } catch {
                notesStatus.textContent = "Saved notes couldn't be read because their data is invalid.";
                renderNotes();
                return;
            }

            if (!Array.isArray(parsedNotes) || parsedNotes.some((note) =>
                !note || typeof note.id !== "string" || typeof note.title !== "string" || typeof note.content !== "string"
            )) {
                notesStatus.textContent = "Saved notes couldn't be read because their data is invalid.";
                renderNotes();
                return;
            }

            notes = parsedNotes;
            renderNotes();
        };

        const playTurn = (event) => {
            const cell = event.currentTarget;
            const index = Number(cell.dataset.cell);
            if (gameOver || gameBoard[index]) {
                return;
            }

            gameBoard[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.setAttribute("aria-label", `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}, ${currentPlayer}`);
            cell.disabled = true;

            const hasWon = winningLines.some((line) => line.every((position) => gameBoard[position] === currentPlayer));
            if (hasWon) {
                gameStatus.textContent = `${currentPlayer} wins!`;
                gameOver = true;
                gameCells.forEach((gameCell) => {
                    gameCell.disabled = true;
                });
            } else if (gameBoard.every(Boolean)) {
                gameStatus.textContent = "It's a draw!";
                gameOver = true;
            } else {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                gameStatus.textContent = `${currentPlayer}'s turn`;
            }
        };

        const getCanvasPoint = (event) => {
            const bounds = paintingCanvas.getBoundingClientRect();
            return {
                x: (event.clientX - bounds.left) * paintingCanvas.width / bounds.width,
                y: (event.clientY - bounds.top) * paintingCanvas.height / bounds.height
            };
        };

        pageTitleInput.addEventListener("input", () => {
            document.title = pageTitleInput.value;
            pageHeading.textContent = pageTitleInput.value;
        });

        wallpaperSelector.addEventListener("change", (event) => {
            document.body.dataset.wallpaper = event.target.value;
        });

        paintingCanvas.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            paintingCanvas.setPointerCapture(event.pointerId);
            const point = getCanvasPoint(event);
            paintingContext.beginPath();
            paintingContext.moveTo(point.x, point.y);
            paintingContext.strokeStyle = paintColor.value;
            paintingContext.lineWidth = 5 * paintingCanvas.width / paintingCanvas.getBoundingClientRect().width;
            paintingContext.lineCap = "round";
            paintingContext.lineJoin = "round";
            isPainting = true;
        });

        paintingCanvas.addEventListener("pointermove", (event) => {
            if (!isPainting) {
                return;
            }

            const point = getCanvasPoint(event);
            paintingContext.lineTo(point.x, point.y);
            paintingContext.stroke();
        });

        const stopPainting = () => {
            isPainting = false;
        };

        paintingCanvas.addEventListener("pointerup", stopPainting);
        paintingCanvas.addEventListener("pointercancel", stopPainting);
        clearPaintingButton.addEventListener("click", () => {
            paintingContext.clearRect(0, 0, paintingCanvas.width, paintingCanvas.height);
        });
        gameCells.forEach((cell) => cell.addEventListener("click", playTurn));
        resetGameButton.addEventListener("click", () => {
            gameBoard = Array(9).fill("");
            currentPlayer = "X";
            gameOver = false;
            gameStatus.textContent = "X's turn";
            gameCells.forEach((cell, index) => {
                cell.textContent = "";
                cell.disabled = false;
                cell.setAttribute("aria-label", `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}, empty`);
            });
        });
        notesForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const title = noteTitleInput.value.trim();
            const content = noteContentInput.value.trim();
            if (!title || !content) {
                notesStatus.textContent = "Enter a title and note before saving.";
                return;
            }

            if (editingNoteId) {
                notes = notes.map((note) => note.id === editingNoteId ? { ...note, title, content } : note);
                resetNoteForm();
                renderNotes();
                if (saveNotes()) {
                    notesStatus.textContent = "Note updated.";
                }
                return;
            }

            notes.unshift({ id: `${Date.now()}-${Math.random()}`, title, content });
            resetNoteForm();
            renderNotes();
            if (saveNotes()) {
                notesStatus.textContent = "Note added.";
            }
        });
        cancelNoteEditButton.addEventListener("click", () => {
            resetNoteForm();
            notesStatus.textContent = "Edit canceled.";
        });
        loadNotes();
    </script>
</body>
</html>
