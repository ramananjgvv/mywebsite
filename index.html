<!DOCTYPE html>
<html>
<head>
    <!-- The title shows up at the very top tab of your web browser -->
    <title>My Awesome Web Page</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
            background:
                radial-gradient(ellipse at 20% 20%, #f9a8d4 0, transparent 40%),
                radial-gradient(ellipse at 80% 80%, #67e8f9 0, transparent 45%),
                linear-gradient(135deg, #312e81, #7c3aed 55%, #2563eb);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 16px 32px;
            background: rgb(22 18 55 / 35%);
            border-bottom: 1px solid rgb(255 255 255 / 20%);
            backdrop-filter: blur(12px);
        }

        .toolbar a {
            color: inherit;
            text-decoration: none;
        }

        .toolbar-brand {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .toolbar-search {
            display: flex;
            flex: 1;
            gap: 8px;
            max-width: 520px;
            margin: 0 auto;
        }

        .toolbar-search input {
            flex: 1;
            min-width: 0;
            padding: 8px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .toolbar-search button {
            padding: 8px 12px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
            cursor: pointer;
        }

        .toolbar-links {
            display: flex;
            gap: 24px;
        }

        .toolbar-settings {
            position: relative;
        }

        .toolbar-settings summary {
            cursor: pointer;
            list-style: none;
        }

        .toolbar-settings summary::-webkit-details-marker {
            display: none;
        }

        .settings-menu {
            position: absolute;
            z-index: 1;
            top: calc(100% + 12px);
            right: 0;
            min-width: 190px;
            padding: 16px;
            border: 1px solid rgb(255 255 255 / 25%);
            border-radius: 12px;
            background: #211c4b;
            box-shadow: 0 12px 30px rgb(0 0 0 / 25%);
            text-align: left;
        }

        .settings-menu label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .settings-menu select,
        .settings-menu input {
            width: 100%;
            padding: 8px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .toolbar-links a:hover,
        .toolbar-links a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        .toolbar-settings summary:hover,
        .toolbar-settings summary:focus-visible {
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        body[data-wallpaper="sunset"] {
            background:
                radial-gradient(ellipse at 75% 15%, #fde68a 0, transparent 35%),
                linear-gradient(145deg, #7f1d4e, #ea580c 55%, #fbbf24);
        }

        body[data-wallpaper="ocean"] {
            background:
                radial-gradient(ellipse at 20% 20%, #67e8f9 0, transparent 40%),
                radial-gradient(ellipse at 85% 75%, #60a5fa 0, transparent 45%),
                linear-gradient(135deg, #082f49, #0369a1 55%, #164e63);
        }

        body[data-wallpaper="forest"] {
            background:
                radial-gradient(ellipse at 75% 20%, #bef264 0, transparent 38%),
                radial-gradient(ellipse at 15% 85%, #34d399 0, transparent 45%),
                linear-gradient(135deg, #14532d, #166534 55%, #064e3b);
        }

        main {
            flex: 1;
            display: grid;
            place-content: center;
            padding: 24px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .signup-form {
            display: grid;
            gap: 12px;
            max-width: 360px;
            margin: 32px auto 0;
            text-align: left;
        }

        .signup-form label {
            font-weight: 600;
        }

        .signup-form input,
        .signup-form button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            font: inherit;
        }

        .signup-form input {
            color: #211c4b;
        }

        .signup-form button {
            color: #211c4b;
            cursor: pointer;
        }

        #signup-status {
            min-height: 1.6em;
        }

        .painting-section {
            margin: 40px auto 0;
        }

        .painting-tools {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .painting-tools label {
            font-weight: 600;
        }

        .painting-tools input,
        .painting-tools button {
            min-height: 40px;
            padding: 6px 10px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            color: #211c4b;
            font: inherit;
        }

        .painting-tools input {
            width: 48px;
            padding: 4px;
        }

        .painting-tools button {
            cursor: pointer;
        }

        #painting-canvas {
            display: block;
            width: min(100%, 640px);
            height: auto;
            aspect-ratio: 2;
            border: 1px solid rgb(255 255 255 / 70%);
            border-radius: 8px;
            background: #fff;
            cursor: crosshair;
            touch-action: none;
        }

        @media (max-width: 480px) {
            .toolbar {
                padding: 14px 18px;
            }

            .toolbar-search {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .toolbar-links {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <a class="toolbar-brand" href="#home">My world</a>
        <form class="toolbar-search" action="https://www.google.com/search" method="get" role="search">
            <input type="search" name="q" aria-label="Search Google" placeholder="Search the web" required>
            <button type="submit">Search</button>
        </form>
        <details class="toolbar-settings">
            <summary>Settings</summary>
            <div class="settings-menu">
                <label for="page-title-setting">Page title</label>
                <input id="page-title-setting" type="text" value="My Awesome Web Page">
                <label for="wallpaper">Wallpaper</label>
                <select id="wallpaper">
                    <option value="aurora">Aurora</option>
                    <option value="sunset">Sunset</option>
                    <option value="ocean">Ocean</option>
                    <option value="forest">Forest</option>
                </select>
            </div>
        </details>
    </header>
    <main id="home">
        <section aria-labelledby="page-title">
            <h1 id="page-title">Hello, World! 🚀</h1>
            <p id="about">Welcome to my very first website built by me, my name is raj!</p>
            <p>today is a holiday</p>
            <h2>Sign up</h2>
            <form class="signup-form" id="signup-form">
                <label for="signup-email">Email</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" required>
                <label for="signup-username">Username</label>
                <input id="signup-username" name="username" type="text" autocomplete="username" required>
                <label for="signup-password">Password</label>
                <input id="signup-password" name="password" type="password" autocomplete="new-password" required>
                <button type="submit">Sign up</button>
            </form>
            <p id="signup-status" role="status" aria-live="polite"></p>
            <section class="painting-section" aria-labelledby="painting-title">
                <h2 id="painting-title">Painting</h2>
                <div class="painting-tools">
                    <label for="paint-color">Brush color</label>
                    <input id="paint-color" type="color" value="#211c4b">
                    <button id="clear-painting" type="button">Clear</button>
                </div>
                <canvas id="painting-canvas" width="800" height="400" aria-label="Painting canvas. Draw by dragging with a mouse, touch, or pen.">
                    Your browser does not support the painting canvas.
                </canvas>
            </section>
        </section>
    </main>
    <script>
        const pageTitleInput = document.querySelector("#page-title-setting");
        const pageHeading = document.querySelector("#page-title");
        const wallpaperSelector = document.querySelector("#wallpaper");
        const signupForm = document.querySelector("#signup-form");
        const signupStatus = document.querySelector("#signup-status");
        const paintingCanvas = document.querySelector("#painting-canvas");
        const paintingContext = paintingCanvas.getContext("2d");
        const paintColor = document.querySelector("#paint-color");
        const clearPaintingButton = document.querySelector("#clear-painting");
        let isPainting = false;

        const getCanvasPoint = (event) => {
            const bounds = paintingCanvas.getBoundingClientRect();
            return {
                x: (event.clientX - bounds.left) * paintingCanvas.width / bounds.width,
                y: (event.clientY - bounds.top) * paintingCanvas.height / bounds.height
            };
        };

        pageTitleInput.addEventListener("input", () => {
            document.title = pageTitleInput.value;
            pageHeading.textContent = pageTitleInput.value;
        });

        wallpaperSelector.addEventListener("change", (event) => {
            document.body.dataset.wallpaper = event.target.value;
        });

        signupForm.addEventListener("submit", (event) => {
            event.preventDefault();
            signupStatus.textContent = "Thanks! This demo does not save or send your details.";
            signupForm.reset();
        });

        paintingCanvas.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            paintingCanvas.setPointerCapture(event.pointerId);
            const point = getCanvasPoint(event);
            paintingContext.beginPath();
            paintingContext.moveTo(point.x, point.y);
            paintingContext.strokeStyle = paintColor.value;
            paintingContext.lineWidth = 5 * paintingCanvas.width / paintingCanvas.getBoundingClientRect().width;
            paintingContext.lineCap = "round";
            paintingContext.lineJoin = "round";
            isPainting = true;
        });

        paintingCanvas.addEventListener("pointermove", (event) => {
            if (!isPainting) {
                return;
            }

            const point = getCanvasPoint(event);
            paintingContext.lineTo(point.x, point.y);
            paintingContext.stroke();
        });

        const stopPainting = () => {
            isPainting = false;
        };

        paintingCanvas.addEventListener("pointerup", stopPainting);
        paintingCanvas.addEventListener("pointercancel", stopPainting);
        clearPaintingButton.addEventListener("click", () => {
            paintingContext.clearRect(0, 0, paintingCanvas.width, paintingCanvas.height);
        });
    </script>
</body>
</html>
