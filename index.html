<!DOCTYPE html>
<html>
<head>
    <!-- The title shows up at the very top tab of your web browser -->
    <title>My Awesome Web Page</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
            background:
                radial-gradient(ellipse at 20% 20%, #f9a8d4 0, transparent 40%),
                radial-gradient(ellipse at 80% 80%, #67e8f9 0, transparent 45%),
                linear-gradient(135deg, #312e81, #7c3aed 55%, #2563eb);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 16px 32px;
            background: rgb(22 18 55 / 35%);
            border-bottom: 1px solid rgb(255 255 255 / 20%);
            backdrop-filter: blur(12px);
        }

        .toolbar a {
            color: inherit;
            text-decoration: none;
        }

        .toolbar-brand {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .toolbar-links {
            display: flex;
            gap: 24px;
        }

        .toolbar-links a:hover,
        .toolbar-links a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        main {
            flex: 1;
            display: grid;
            place-content: center;
            padding: 24px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .toolbar {
                padding: 14px 18px;
            }

            .toolbar-links {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <a class="toolbar-brand" href="#home">My Website</a>
        <nav class="toolbar-links" aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>
    <main id="home">
        <section aria-labelledby="page-title">
            <h1 id="page-title">Hello, World! 🚀</h1>
            <p id="about">Welcome to my very first website built by me, my name is ramanan!</p>
            <p>today is a holiday</p>
        </section>
    </main>
</body>
</html>
